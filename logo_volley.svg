<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Gradient fond balle -->
    <radialGradient id="ballGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <!-- Gradient texte -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <!-- Ombre balle -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#D97706" flood-opacity="0.4"/>
    </filter>
    <!-- Ombre texte -->
    <filter id="textShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1E3A5F" flood-opacity="0.2"/>
    </filter>
    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond arrondi élégant -->
  <rect x="0" y="0" width="400" height="120" rx="16" fill="#0F172A"/>
  <rect x="2" y="2" width="396" height="116" rx="14" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Éclat lumineux fond -->
  <ellipse cx="80" cy="40" rx="60" ry="40" fill="#2563EB" opacity="0.08"/>

  <!-- BALLE DE VOLLEY -->
  <g transform="translate(28, 12)" filter="url(#shadow)">
    <!-- Cercle principal -->
    <circle cx="48" cy="48" r="44" fill="url(#ballGrad)"/>

    <!-- Lignes courbes de la balle -->
    <!-- Ligne 1 : courbe verticale gauche -->
    <path d="M 48 4 C 20 15, 8 35, 10 58 C 12 78, 25 90, 48 92"
          fill="none" stroke="#1E3A5F" stroke-width="2.5" stroke-opacity="0.35"/>
    <!-- Ligne 2 : courbe verticale droite -->
    <path d="M 48 4 C 76 15, 88 35, 86 58 C 84 78, 71 90, 48 92"
          fill="none" stroke="#1E3A5F" stroke-width="2.5" stroke-opacity="0.35"/>
    <!-- Ligne 3 : courbe horizontale haut -->
    <path d="M 4 48 C 15 22, 35 10, 58 12 C 78 14, 90 27, 92 48"
          fill="none" stroke="#1E3A5F" stroke-width="2.5" stroke-opacity="0.35"/>
    <!-- Ligne 4 : courbe horizontale bas -->
    <path d="M 4 48 C 15 74, 35 86, 58 84 C 78 82, 90 69, 92 48"
          fill="none" stroke="#1E3A5F" stroke-width="2.5" stroke-opacity="0.35"/>

    <!-- Reflet brillant -->
    <ellipse cx="33" cy="28" rx="14" ry="9" fill="white" opacity="0.45" transform="rotate(-25, 33, 28)"/>
    <ellipse cx="28" cy="24" rx="6" ry="4" fill="white" opacity="0.6" transform="rotate(-25, 28, 24)"/>
  </g>

  <!-- TEXTE PRINCIPAL -->
  <text x="132" y="52"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36"
        font-weight="700"
        fill="url(#textGrad)"
        filter="url(#textShadow)"
        letter-spacing="2">VOLLEY</text>

  <text x="134" y="82"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="26"
        font-weight="400"
        fill="#F59E0B"
        letter-spacing="8">CLUB</text>

  <!-- Ligne décorative sous VOLLEY -->
  <line x1="132" y1="88" x2="355" y2="88" stroke="#2563EB" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Petite étoile décorative -->
  <text x="362" y="68" font-size="18" fill="#F59E0B" filter="url(#glow)">★</text>

  <!-- Année -->
  <text x="134" y="105"
        font-family="Georgia, serif"
        font-size="11"
        fill="#64748B"
        letter-spacing="4">DEPUIS 2020</text>

</svg>
